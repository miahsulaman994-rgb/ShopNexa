<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopNexa Live</title>
<style>
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px}
.card{background:white;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px #ddd}
.card img{width:100%;height:140px;object-fit:contain}
.price{color:#087443;font-weight:bold}
.btn{display:inline-block;background:#ff9900;color:#111;padding:10px;border-radius:6px;text-decoration:none;font-weight:bold;margin-top:5px}
.notice{text-align:center;font-size:13px;color:#555}
@media(min-width:700px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header><h1>ShopNexa Live</h1><p>আপনার পছন্দের পণ্য, এক জায়গায়!</p></header>
<p class="notice">As an Amazon Associate, I earn from qualifying purchases.</p>
<main class="container"><h2>🛍️ জনপ্রিয় পণ্য</h2><div id="products" class="products"></div></main>
<script>
const products= [ 
{
p: "Sweejar Lotus Tea Infuser Mug 16oz - Amazon's Choice",
price: "4.8★ (2,728) - Best Seller!",
image: "https://images.unsplash.com/photo-1577937927133-66ef06acdf18?q=80&w=600",
link: "https://www.amazon.com/dp/B0EF0Q094?tag=shopnexa070-20"
},
{
p: "Smart Watch",
price: "Amazon-এ দাম দেখুন",
image: "https://images.unsplash.com/photo-1523275335684-37898b6b30ce?q=80&w=600",
link: "https://www.amazon.com/dp/B0EF0Q094?tag=shopnexa070-20"
},
{
p: "Laptop",
price: "Amazon-এ দাম দেখুন",
image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?q=80&w=600",
link: "https://www.amazon.com/s?k=laptop&tag=shopnexa070-20"
},
{
p: "Featured Product",
price: "Amazon-এ দাম দেখুন",
image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=600",
link: "https://www.amazon.com/s?k=featured&tag=shopnexa070-20"
}
];
];
const grid=document.getElementById("products");
products.forEach(p=>{
const card=document.createElement("article");card.className="card";
const img=document.createElement("img");img.src=p.image;img.alt=p.p;
const title=document.createElement("h3");title.textContent=p.p;
const price=document.createElement("p");price.className="price";price.textContent=p.price;
const a = document.createElement("a");
a.className = "btn";
a.href = p.link;
a.target = "_blank";
a.rel = "nofollow sponsored noopener";
a.textContent = "Amazon-এ কিনুন 🛒";
card.appendChild(img);
card.appendChild(title);
card.appendChild(price);
card.appendChild(a);
grid.appendChild(card);
});
</script>
</body>
</html>
