<script>
  const AFFILIATE_TAG = "shopnexa070-20";

  // ডিফল্ট প্রোডাক্ট লিস্ট
  const defaultProducts =[
    {
   p: "Wireless Earbuds",
    price: "$29.99",
    image: "https://images.unsplash.com/photo-1500658268037-6bf1216a5a8f?w=500",
    link: "https://amzn.to/4hGcMAE"
  },
    {
      p: "Smart Watch",
      price: "$49.99",
      image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
      link: "https://www.amazon.com/dp/B08N5WRWNW"
    },
    {
      p: "Laptop",
      price: "$499.99",
      image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500",
      link: "https://www.amazon.com/dp/B08N5WRWNW"
    }
  ];

  // LocalStorage থেকে প্রোডাক্ট লোড করার ফাংশন
  function getProducts() {
    const saved = localStorage.getItem("shopnexa_products");
    return saved ? JSON.parse(saved) : defaultProducts;
  }

  // LocalStorage এ প্রোডাক্ট সেভ করার ফাংশন
  function save(products) {
    localStorage.setItem("shopnexa_products", JSON.stringify(products));
  }

  // প্রোডাক্ট শো করার প্রধান ফাংশন
  function render() {
    const grid = document.getElementById("products");
    if (!grid) return;

    const products = getProducts();
    grid.innerHTML = ""; // আগের ডাটা ক্লিয়ার করা

    products.forEach(p => {
      let affLink = p.link || "#";
      if (affLink.includes("amazon.com") && !affLink.includes("tag=")) {
        affLink += (affLink.includes("?") ? "&" : "?") + "tag=" + AFFILIATE_TAG;
      }

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${p.image || 'https://via.placeholder.com/300'}" alt="${p.p}">
        <h3>${p.p}</h3>
        <p class="price">${p.price}</p>
        <a href="${affLink}" target="_blank" class="btn">এখনই কিনুন →</a>
      `;
      grid.appendChild(card);
    });
  }

  // পেজ লোড হলে প্রোডাক্ট রেন্ডার হবে
  document.addEventListener("DOMContentLoaded", render);
</script>
